<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 600px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #e8f5e9;
            color: #2e7d32;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .card {
                width: 90%;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Student Registration</h1>

        <p class="description">
            Enter your details below
        </p>

        <form id="studentForm">

            <div class="row">

                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="First name" required>
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Last name" required>
                </div>

            </div>

            <div class="row">

                <div class="field">
                    <label>Student ID</label>
                    <input type="text" placeholder="e.g. 2026001" required>
                </div>

                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

            </div>

            <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="student@example.com" required>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>
            </div>

            <div class="row">

                <div class="field">
                    <label>Department</label>
                    <select required>
                        <option value="">Select Department</option>
                        <option>Computer Science</option>
                        <option>Information Science</option>
                        <option>Electronics</option>
                        <option>Electrical</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                    </select>
                </div>

                <div class="field">
                    <label>Year</label>
                    <select required>
                        <option value="">Select Year</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>

            </div>

            <div class="field">
                <label>Address</label>
                <input type="text" placeholder="Enter your address" required>
            </div>

            <button type="submit">
                Register Student
            </button>

        </form>

        <div id="result">
            Student registered successfully!
        </div>

    </div>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("result").style.display = "block";

            this.reset();
        });
    </script>

</body>
</html>
